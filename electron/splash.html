<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIST AI Terminal</title>
<style>
html,body{height:100%;margin:0;background:#07121a;color:#e8f2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{height:100%;display:grid;place-items:center}
.card{text-align:center;padding:42px 52px;border:1px solid #173545;border-radius:18px;background:linear-gradient(180deg,#0b1f2b,#07131c);box-shadow:0 28px 90px #0008;min-width:420px}
.logo{width:72px;height:72px;margin:auto;border-radius:18px;background:linear-gradient(135deg,#0e7aa7,#21d88a);display:grid;place-items:center;font-size:30px;font-weight:800;color:#041016}
h1{margin:18px 0 5px;font-size:24px}p{margin:0;color:#7f99aa;font-size:12px}
.loader{height:3px;background:#102b38;border-radius:10px;overflow:hidden;margin-top:24px}.loader i{display:block;width:35%;height:100%;background:#32d89a;animation:load 1.2s infinite ease-in-out}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(400%)}}
small{display:block;margin-top:10px;color:#526c7d}
</style>
</head>
<body><main><div class="card"><div class="logo">BA</div><h1>BIST AI Terminal</h1><p>Quant Research Desktop</p><div class="loader"><i></i></div><small>Yerel veri motoru başlatılıyor…</small></div></main></body>
</html>
