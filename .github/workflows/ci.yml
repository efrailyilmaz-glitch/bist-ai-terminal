name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: node --check app/static/app.js
      - run: node --check app/static/research.js
      - run: node --check app/static/v5.js
      - run: node --check app/static/v6.js
      - run: node --check app/static/v7.js
      - run: node --check electron/main.cjs
      - name: Technical engine smoke test
        run: |
          python - <<'PY'
          import numpy as np, pandas as pd
          from app.scoring import score_frame, indicator_frame
          from app.advanced_indicators import analyze_structure
          from app.backtest import _positions, _metrics
          n=320
          x=np.arange(n)
          close=100+x*.10+np.sin(x/7)*2
          df=pd.DataFrame({'Open':close-.3,'High':close+1.2,'Low':close-1.1,'Close':close,'Volume':1_000_000+(np.sin(x/5)+1)*180_000})
          out=score_frame(df,benchmark_return_20=2,benchmark_return_60=5)
          structure=analyze_structure(df)
          assert out and out['above_ema20'] in [True,False] and 'near_52w_high' in out
          assert structure['supertrend'] in ['BULLISH','BEARISH']
          for s in ['ma_trend','momentum','breakout','rsi_reversion','supertrend']:
              p=_positions(df,s,20,50)
              m=_metrics(df,p,10,5)
              assert 'sortino' in m and 'cvar95_daily_pct' in m
          print('technical/backtest smoke ok')
          PY
      - name: V5 research and portfolio smoke test
        run: |
          python - <<'PY'
          import numpy as np, pandas as pd
          from app.fundamentals import _compute_scores
          from app.kap_engine import classify
          from app.news_engine import score_headline
          from app.portfolio_analytics import _weights, _portfolio_stats
          sample={'sector':'Industrials','trailing_pe':12,'price_to_book':2,'ev_to_ebitda':8,'price_to_sales':1.5,'fcf_yield':6,'roe_pct':22,'roa_pct':9,'operating_margin_pct':18,'profit_margin_pct':14,'revenue_growth_pct':20,'earnings_growth_pct':24,'debt_to_equity':.7,'current_ratio':1.6,'free_cash_flow':100,'total_cash':80,'total_debt':120,'dividend_yield_pct':2,'payout_ratio_pct':35,'fcf_conversion_pct':80}
          scores=_compute_scores(sample)
          assert scores['fundamental_score'] is not None
          assert classify('Yeni iş ilişkisi kapsamında önemli sözleşme imzalandı')['sentiment_score']>0
          assert score_headline('Şirket yeni yatırım ve kapasite artışı açıkladı')[0]>0
          rng=np.random.default_rng(1)
          rets=pd.DataFrame(rng.normal(.0004,.012,(500,4)),columns=list('ABCD'))
          for method in ['equal','inverse_vol','min_variance','risk_parity']:
              w=_weights(rets,method)
              assert abs(float(w.sum())-1)<1e-6
              st=_portfolio_stats(rets,w)
              assert 'cvar95_daily_pct' in st
          print('V5 research/portfolio smoke ok')
          PY
      - name: V6 opportunity engine smoke test
        run: |
          python - <<'PY'
          from app.opportunity_engine import score_opportunity
          from app.analyst_engine import _num
          tech={'ticker':'TEST','price':100,'short_score':84,'long_score':78,'smart_money_score':75,'relative_strength_20':8,'relative_strength_60':9,'volume_ratio':1.8,'risk':42,'anomaly_score':30,'avg_value_turnover_20':50000000,'breakout20':True,'supertrend':'BULLISH','ichimoku':'BULLISH','adx':31,'plus_di':30,'minus_di':15,'atr':3,'momentum_120':18,'resistances':[108,116],'supports':[96,91]}
          fund={'fundamental_score':74,'quality_score':80,'growth_score':72,'coverage_pct':80,'target_mean_price':135}
          analyst={'analyst_score':78,'coverage_count':3,'consensus_target':140,'consensus_upside_pct':40}
          out=score_opportunity(tech,fund,analyst,{'global_score':62},{'items':[]},{'headline_sentiment':10})
          assert out['opportunity_score']>=70 and out['targets']['long_target']>100
          assert abs(_num('1.057,19')-1057.19)<0.01
          print('V6 opportunity smoke ok')
          PY
      - name: V7 premium engine smoke test
        run: |
          python - <<'PY'
          from app.premium_engine import _altman,_piotroski
          f={'sector':'Industrials','market_cap':1000}
          a={'latest':{'total_assets':1000,'total_liabilities':400,'current_assets':500,'current_liabilities':200,'retained_earnings':250,'ebit':120,'revenue':1400,'net_income':100,'operating_cash_flow':140,'long_term_debt':180,'shares':100,'gross_profit':450},'previous':{'total_assets':900,'total_liabilities':420,'current_assets':420,'current_liabilities':210,'retained_earnings':200,'ebit':100,'revenue':1200,'net_income':80,'operating_cash_flow':90,'long_term_debt':220,'shares':100,'gross_profit':360}}
          assert _altman(f,a)['score'] is not None
          p=_piotroski(a); assert p['score'] is not None and p['max_score']>=7
          print('V7 premium smoke ok')
          PY
      - run: python -c "from app.main import app; assert app.version == '7.0'; print(app.title, app.version)"
